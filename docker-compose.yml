# Base service definition. It publishes NO port: run it with exactly one deployment override, e.g.
#   docker compose -f docker-compose.yml -f compose.direct.yml up -d   # LAN / testing only
#   docker compose -f docker-compose.yml -f compose.nginx.yml up -d    # behind nginx on the same host
#   docker compose -f docker-compose.yml -f compose.tunnel.yml up -d   # behind a Cloudflare Tunnel
# (Overrides rather than profiles, because a profile cannot remove a `ports:` mapping.)
#
# Settings come from `.env` (copy `.env.example`). Compose refuses to start when a required value
# is missing, and the server itself refuses to boot when a secret is shorter than 32 characters.
name: notes-app

services:
  app:
    build: .
    image: notes-app:latest
    restart: unless-stopped
    # run as the image's app user (uid/gid 1000), as before the image stopped baking in `USER`;
    # `docker compose exec` also runs as 1000. Starting as root is only for platforms like Fly.io
    # that mount root-owned volumes (the entrypoint then fixes /data's owner and drops to 1000).
    user: "1000:1000"
    # optional settings (LOG_LEVEL, ALLOW_SIGNUP, ...) reach the container only through this file; it
    # is optional so that `docker compose config` and `--env-file` work without it, while the
    # required values below still stop Compose with a clear message when they are missing
    env_file:
      - path: .env
        required: false
    environment:
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env (openssl rand -hex 32)}
      SHARE_HMAC_KEY: ${SHARE_HMAC_KEY:?set SHARE_HMAC_KEY in .env (openssl rand -hex 32)}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN in .env (e.g. https://notes.example.com)}
      # fixed inside the container; the deployment override decides TRUST_PROXY and CLIENT_IP_HEADER
      # (pinned empty here so a value in .env can never make a directly exposed app trust a header)
      DATA_DIR: /data
      HOST: 0.0.0.0
      PORT: "3000"
      TRUST_PROXY: ""
      CLIENT_IP_HEADER: ""
    volumes:
      # a named volume (not a bind mount): Docker initialises it from the image's /data, owned by
      # uid/gid 1000. A bind mount must be `chown -R 1000:1000` on the host first.
      - notes-data:/data
    networks:
      - notes

networks:
  notes:
    ipam:
      config:
        - subnet: 172.30.0.0/24
          # pinned: without it Docker takes the gateway from ip_range (172.30.0.128)
          gateway: 172.30.0.1
          # dynamic addresses come from the upper half only, so the fixed 172.30.0.10 used by the
          # tunnel override can never be handed to another container
          ip_range: 172.30.0.128/25

volumes:
  notes-data:
